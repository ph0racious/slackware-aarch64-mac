###################################################################################
# File...: /boot/grub/grub.cfg
# Purpose: GRUB configuration to boot Slackware Linux on an Apple Silicon Mac.
###################################################################################
# Written by the Slackware Installer's GRUB post-install script:
#   /usr/share/hwm-configure/platform/aarch64/installer/helper.scr/000-grub-configure
# It REPLACES Slackware's generic template, which loads /boot/Image-armv8 with
# an initrd -- neither of which this media installs.
#
# The kernel path, root PARTUUID and root filesystem type below are filled in
# at install time from the target that was just installed.  Everything else
# here is literal, so this file is the place to change the installed system's
# kernel command line.  grub-entry-mac --install rewrites the entry between
# the markers, so give it any parameters you add here with --cmdline=.
#
# THREE THINGS ARE DELIBERATE AND EASY TO "FIX" WRONGLY:
#
#   no 'initrd'      Everything on the path to / is built into this kernel
#                    (NVME_APPLE, APPLE_RTKIT, EXT4_FS and EFI_PARTITION
#                    among it).  Referencing an initrd we do not ship makes
#                    GRUB print an error and wait up to 10 seconds before it
#                    boots the kernel anyway.
#
#   no 'devicetree'  U-Boot passes the correct DTB to the kernel via EFI, taken
#                    from boot.bin.  Supplying one here overrides that with a
#                    guess and can break a machine that would otherwise boot.
#                    This is the easiest thing to get wrong.
#
#   root=PARTUUID=   With no initrd the KERNEL resolves root= by itself, and it
#                    understands PARTUUID=, PARTLABEL=, /dev/xxx and major:minor
#                    -- but NOT a filesystem UUID= or LABEL=.  Slackware's own
#                    template gets away with root=LABEL=SLKroot only because it
#                    ships an initrd to resolve it.  Using a label here boots as
#                    far as "VFS: Unable to mount root fs on unknown-block(0,0)"
#                    with the disk visibly detected, which looks like a storage
#                    fault rather than a bad root=.
#
# 'rootwait' IS needed: Apple NVMe probes asynchronously and root may not exist
# at the moment the kernel first looks for it.
#
# console=tty0 IS needed: Apple device trees set chosen/stdout-path = serial0,
# so without it /dev/console is a UART with nothing attached -- a silent boot,
# and any console prompt (an fsck after an unclean shutdown) waits forever.
###################################################################################

set timeout=10
set default=0

# The markers below are the same ones grub-entry-mac manages.  They are
# here so that grub-entry-mac --install REPLACES this entry in place rather
# than adding a second copy of it.
###MAC-BEGIN -- managed by grub-entry-mac, do not edit between markers
menuentry "Slackware Linux (AArch64-mac)" {
   echo "Loading Slackware Linux..."
   insmod part_gpt
   insmod part_msdos
   insmod ext2
   insmod linux
   search --no-floppy --set=root --label SLKroot
   linux %KERNELPATH% root=PARTUUID=%ROOTPARTUUID% rootfstype=%ROOTFSTYPE% rootwait console=tty0
}
###MAC-END

##SLKuefi_settings
menuentry --hotkey=f "[ UEFI Firmware Settings ]" {
   echo "Loading UEFI Firmware Menu..."
   fwsetup
}
##SLKuefi_settings

##SLKreboot
menuentry --hotkey=r "[ Reboot ]" {
   echo "Rebooting..."
   reboot
}
##SLKreboot
