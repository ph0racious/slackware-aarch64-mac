# Do not resurrect a real PulseAudio behind PipeWire's back.
#
# /etc/pulse/client.conf ships `autospawn = yes` (and `allow-autospawn-for-root
# = yes`). With those set, ANY PulseAudio client that fails to connect starts a
# real PulseAudio daemon -- which then grabs the socket pipewire-pulse serves,
# finds no card it can configure, and creates `auto_null`. The desktop shows a
# dummy output, and it looks like broken hardware rather than a sound server
# that was replaced from under you.
#
# ⚠ THIS FILE CLOSES ONE PATH OF TWO. It stops the pulse CLIENT LIBRARY from
# spawning a daemon. It does NOT stop /etc/xdg/autostart/pulseaudio.desktop,
# because /usr/bin/start-pulseaudio-x11 greps /etc/pulse/client.conf LITERALLY
# and never consults this directory -- so it still reads `autospawn = yes` and
# proceeds. That path is closed separately, by this package's doinst.sh and
# again at every boot by rc.asahi-audio, using Slackware's own `Hidden=true`
# switch. Removing only one of the two leaves a hole; see doinst.sh.
#
# Turning autospawn off does NOT prevent running PulseAudio deliberately: it
# only stops clients starting one by accident. If you want PulseAudio back,
# run `/etc/rc.d/rc.asahi-audio stop` and `chmod -x` that script. A desktop
# that runs XDG autostart then starts PulseAudio itself, so this file can stay.
# A session that does not (twm, fvwm2 and the like) relies on autospawn
# instead, which this file turns off, so start PulseAudio there with
# `pulseaudio --start` from the session's own startup rather than delete this
# file: an upgrade would put it back (removepkg asahi-audio, which owns it,
# removes it).
#
# A DROP-IN, NOT AN EDIT. /etc/pulse/client.conf belongs to the pulseaudio
# package; this file belongs to asahi-audio. Nothing stock is modified, the
# change is visible to pkgtools, and removepkg reverses it.
autospawn = no
