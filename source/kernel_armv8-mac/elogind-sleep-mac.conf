# /etc/elogind/sleep.conf.d/20-mac.conf -- from kernel_armv8-mac.
#
# Slackware ARM's installer disables sleep on every ARM machine
# (helper.scr/010-pwrmgmt sets AllowSuspend=no in /etc/elogind/sleep.conf).
# Apple Silicon suspends to idle and wakes on the power button or a laptop
# lid, so this port allows suspend again. Hibernation stays off.
#
# To follow Slackware ARM's default, set AllowSuspend=no here rather than
# delete this file: an edited copy is kept across kernel upgrades, but a
# deleted one is installed again by the next.
[Sleep]
AllowSuspend=yes
